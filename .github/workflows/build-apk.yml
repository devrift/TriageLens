name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Grant Execute Permissions for gradlew
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Assemble Debug APK with Gradle
        run: |
          cd android
          ./gradlew clean assembleDebug --stacktrace
          cd ..

      - name: Verify APK Binary Container
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$APK_PATH")
          echo "Built APK size: $FILE_SIZE bytes"
          if [ "$FILE_SIZE" -lt 3000000 ]; then
            echo "ERROR: APK size ($FILE_SIZE bytes) is below minimum valid threshold of 3 MB"
            exit 1
          fi
          echo "SUCCESS: Valid Android APK compiled ($((FILE_SIZE / 1024 / 1024)) MB)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "TriageLens Mobile Android APK v1.0.0"
          body: "Official Android APK build for TriageLens (offline-first vital sign telemetry engine)."
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

